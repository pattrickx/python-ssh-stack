services:
  python-ssh:
    image: python-ssh:latest
    container_name: python-ssh
    hostname: python-ssh
    restart: unless-stopped
    ports:
      - "2222:22"
    # GPU passthrough (host roda nvidia-container-toolkit; runtime default = nvidia)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # FLUX precisa de bastante shared memory
    shm_size: "8gb"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # Cache LOCAL dos pesos do FLUX (roda 100% local, sem API HF)
      - HF_HOME=/root/test-flux/models
      - HF_HUB_CACHE=/root/test-flux/models/hub
